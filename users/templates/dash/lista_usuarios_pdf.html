<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Helvetica, sans-serif; color: #333; }
        h1 { text-align: center; color: #28a745; }
        .fecha { text-align: right; font-size: 12px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background-color: #28a745; color: white; padding: 8px; text-align: left; font-size: 12px; }
        td { border-bottom: 1px solid #ddd; padding: 8px; font-size: 11px; }
    </style>
</head>
<body>
    <h1>{{ titulo }}</h1>
    <div class="fecha">Generado el: {{ fecha|date:"d/M/Y H:i" }}</div>

    <table>
        <thead>
            <tr>
                <th>Nombre de Usuario</th>
                <th>Correo Electrónico</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            {% for user in usuarios %}
            <tr>
                <td>{{ user.nombre }}</td>
                <td>{{ user.correo }}</td>
                <td>{% if user.estado.id == 1 %}Activo{% else %}Inactivo{% endif %}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
