{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro </title>
    <link rel="stylesheet" href="{% static 'css/formulario.css' %}">
  
     <!-- Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Bootstrap-->
    <!--Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.css" integrity="sha512-U9Y1sGB3sLIpZm3ePcrKbXVhXlnQNcuwGQJ2WjPjnp6XHqVTdgIlbaDzJXJIAuCTp3y22t+nhI4B88F/5ldjFA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body, p, input, button, label { font-family: 'Open Sans', sans-serif !important; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Montserrat', sans-serif !important; }
    </style>
        <!--Font Awesome -->
    <link href="https://cdn.jsdelivr.net/gh/eliyantosarage/font-awesome-pro@main/fontawesome-pro-6.5.2-web/css/all.min.css" rel="stylesheet">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
   
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Cargando...</p>
    </div>
    <div class="contenedor-inicio">
        <!-- Flecha de regreso al index-->
        <div class="arrow">
            <a href="{% url 'login_view'%}"><i class="fa-solid fa-chevron-left"></i></a>
        </div>
        <!-- Imagen de formulario-->
        <div class="image-container">
            <img src="{% static 'images/Tanques_3.webp' %}" alt="Tanques">
        </div>
        <div class="form-contenedor_inicio">
            <h2>Registro Usuario</h2>
            
            <!-- Formulario de registro-->
            <form method="post">
                {% csrf_token %}
                <!-- Por cada campo en el formulario, que me traiga el label y el input-->
                {%for field in form%}
                    {{field.label_tag}}
                    {{field}}
                {% endfor %}
                
                <!-- Campo de Rol Automático (Solo lectura para seguridad) -->
                <div style="margin-bottom: 20px;">
                    <label for="rol_display" style="display: block; margin-bottom: 5px;">Rol de la cuenta:</label>
                    <input type="text" id="rol_display" value="Empleado" disabled style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; background-color: #e9ecef; color: #555; cursor: not-allowed;">
                    <small style="display: block; margin-top: 5px; color: #777; font-size: 0.85em;">* Los permisos de Administrador se asignan exclusivamente desde el panel de gestión.</small>
                </div>

                <button type="submit">Registrarse</button>
            </form>
        </div>
    </div>
    <!-- Trae de la plantilla meensajes.html los mensajes-->
    {% include 'plantillas/mensajes.html' %}
      <!-- sweet alert-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{% static 'js/script.js'%}"></script>
</body>
</html>
